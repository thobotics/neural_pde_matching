# @package _global_
# Hydra configuration for logging, multirun, etc.

hydra:
  # Output paths for hydra logs
  run:
    dir: logs/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: logs/multiruns/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

  job:
    # Configuration for the ${hydra.job.override_dirname} runtime variable
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys:
          - work_dir
          - hydra
          - experiment_name

  # Enable launcher for multirun
  launcher:
    _target_: hydra._internal.BasicLauncher

  # Sweeper configuration for parameter sweeps
  sweeper:
    _target_: hydra._internal.BasicSweeper
    max_batch_size: null
    
  # Job logging configuration
  job_logging:
    formatters:
      simple:
        format: '[%(levelname)s] - %(message)s'
    handlers:
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra:runtime.output_dir}/hydra.log
