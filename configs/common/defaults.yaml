# @package _global_
# Common configurations shared across experiments

# Random seed for reproducibility (null = random seed)
seed: 42
deterministic: false  # Set to true for full determinism (slower training)

# Global experiment settings
experiment_name: ContinuousMeshGraphNets
debug: false

# Training hyperparameters
lr: 5e-4
epochs: 50
batch_size: 16
num_workers: 16

# Training settings
training_noise: true
training_noise_std: 1e-2
val_per_steps: 10

# Model settings
rollout_train: false
rollout_val: true

# Paths
work_dir: ${hydra:runtime.cwd}
