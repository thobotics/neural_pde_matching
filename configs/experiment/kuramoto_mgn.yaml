# @package _global_

defaults:
  - /trainer: default
  - /optimizer: adam
  - /scheduler: step
  - /logger: wandb
  - /plot: wandb
  - /model: mgn
  - /callbacks: default
  - /cluster: local
  - /env: kuramoto
  - /dataset: kuramoto
  - override /hydra/job_logging: colorlog
  - override /hydra/hydra_logging: colorlog
  - _self_

# Global configurations
experiment_name: Kuramoto
seed: 42
lr: 5e-4
epochs: 500
batch_size: 16
num_workers: 16
scheduler: null
debug: False
training_noise: True
training_noise_std: 1e-2
val_per_steps: 10
rollout_train: False
rollout_val: True

trainer:
  check_val_every_n_epoch: 3

model:
  num_messages: 15

plot:
  animation:
    fps: 5
    skip_frames: 5
    n_images: 5

logger:
  group: Kuramoto
  job_type: mgn_m=${model.num_messages}
  name: ks_mgn_seed=${seed}

# MGN uses different window size
dataset:
  window_size: 2
  window_shift: 1
