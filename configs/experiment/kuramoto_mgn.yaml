# @package _global_
# Abaqus Plate Deformation MGN experiment

defaults:
  - /trainer: default
  - /optimizer: adam
  - /scheduler: step
  - /logger: wandb  # wandb or mlflow
  - /plot: wandb
  - /model: mgn
  - /callbacks: default
  - /cluster: local
  - override /hydra/job_logging: colorlog
  - override /hydra/hydra_logging: colorlog
  - _self_

# Global configurations
experiment_name: Kuramoto
seed: 42
lr: 5e-4
epochs: 500  # default is 50
batch_size: 16
num_workers: 16
scheduler: null
debug: False
training_noise: True
training_noise_std: 1e-2
val_per_steps: 10
rollout_train: False
rollout_val: True

trainer:
  check_val_every_n_epoch: 3

model:
  num_messages: 15

env:
  name: "KuramotoEnv"
  input_keys: ["PROPERTIES", "STATE"]
  output_keys: ["STATE", "STATE_DOT"]
  ignore_n_initial_steps: 0
  training_noise: ${training_noise}
  training_noise_std: ${training_noise_std}
  visualizer:
    n_columns: 3
    overlayed_ground_truth: False
    support_negative_density: True
    plot_as_images: True

plot:
  animation:
    fps: 5
    skip_frames: 5
    n_images: 5

logger:
  group: Kuramoto
  job_type: mgn_m=${model.num_messages}
  name: ks_mgn_seed=${seed}

dataset:
  root: ./dataset_public/kuramoto_sivashinsky
  window_size: 2
  window_shift: 1
  val_window_size: 101
  val_window_shift: 100
  train_n_sequences: null
  val_n_sequences: null
  shuffle: True
  pin_memory: True
