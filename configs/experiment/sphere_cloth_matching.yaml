# @package _global_

defaults:
  - /trainer: default
  - /optimizer: adam
  - /scheduler: step
  - /logger: wandb
  - /plot: wandb
  - /model: pde_matching_igns
  - /callbacks: default
  - /cluster: local
  - /env: sphere_cloth
  - /dataset: sphere_cloth
  - override /hydra/job_logging: colorlog
  - override /hydra/hydra_logging: colorlog
  - _self_

# Global configurations
experiment_name: SphereCloth
seed: 42
lr: 5e-4
epochs: 5000
batch_size: 8
num_workers: 8
scheduler: null
debug: False
training_noise: False
training_noise_std: 1e-2
val_per_steps: 10
rollout_train: False
rollout_val: False

trainer:
  check_val_every_n_epoch: 20

model:
  warmup_steps: 20

plot:
  animation:
    fps: 10
    skip_frames: 2
    n_images: 5
  plot_at_every_n_val_step: 5

logger:
  group: SphereCloth
  job_type: ${model.dynamic_name}
  name: scc_${model.dynamic_name}_seed=${seed}
