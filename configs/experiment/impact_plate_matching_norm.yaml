# @package _global_

defaults:
  - /trainer: default
  - /optimizer: adam
  - /scheduler: step
  - /logger: wandb  # wandb or mlflow
  - /plot: wandb
  - /model: pde_matching_igns
  - /callbacks: default
  - /cluster: local
  - override /hydra/job_logging: colorlog
  - override /hydra/hydra_logging: colorlog
  - _self_

# Global configurations
experiment_name: ImpactPlate
seed: 42
lr: 5e-4
epochs: 2000  # default is 50
batch_size: 4
num_workers: 4
scheduler: null
debug: False
training_noise: False
training_noise_std: 1e-2
val_per_steps: 10
rollout_train: False
rollout_val: False

trainer:
  check_val_every_n_epoch: 20
  gradient_clip_val: 0.5

model:
  name: PDEMatching
  warmup_steps: 15

env:
  name: "ImpactPlateNormEnv"
  input_keys: ["PROPERTIES", "STATE", "STATE_DOT"]
  output_keys: ["STATE", "STATE_DOT"]
  ignore_n_initial_steps: 0
  training_noise: ${training_noise}
  training_noise_std: ${training_noise_std}
  visualizer:
    plot_stress: True
    n_columns: 3
    overlayed_ground_truth: False
    stress_only: False
    xy_min: [0.0, 0.0]
    xy_max: [1.0, 2.0]

logger:
  group: ImpactPlate
  job_type: ${model.dynamic_name}
  name: ip_${model.dynamic_name}_seed=${seed}

dataset:
  root: /home/taihoang/datasets_new/impact_plate_norm_all_2
  window_size: 51
  window_shift: 51
  val_window_size: 51
  val_window_shift: 51
  train_n_sequences: null
  val_n_sequences: null
  shuffle: True
  pin_memory: True
