# @package _global_

defaults:
  - /trainer: default
  - /optimizer: adam
  - /scheduler: step
  - /logger: wandb
  - /plot: wandb
  - /model: pde_matching_igns
  - /callbacks: default
  - /cluster: local
  - /env: wave_balls
  - /dataset: wave_balls
  - override /hydra/job_logging: colorlog
  - override /hydra/hydra_logging: colorlog
  - _self_

# Global configurations
experiment_name: WaveBalls_Long_200
seed: 42
lr: 5e-4
epochs: 3000
batch_size: 4
num_workers: 4
scheduler: null
debug: False
training_noise: False
training_noise_std: 1e-2
val_per_steps: 10
rollout_train: False
rollout_val: False

curriculum_training:
  enabled: True
  end_epoch: 1000
  start_timestep: 5
  step_size: 2

trainer:
  check_val_every_n_epoch: 20
  gradient_clip_val: 0.5

model:
  warmup_steps: 0
  stop_gradient_at_step: 0
  use_relative_timestep: True
  num_substeps: 1
  loss_linear_weighting: False
  dynamic_config:
    num_enc_layers: 1
    damping_factor: 0.0
    external_force_factor: 2.0

# Long 200 variant
env:
  name: "WaveLong200Env"

plot:
  animation:
    fps: 10
    n_images: 3
    skip_frames: 5
  plot_at_every_n_val_step: 5

logger:
  group: WaveBalls_200
  job_type: ${model.dynamic_name}
  name: wf_${model.dynamic_name}_seed=${seed}

# Long 200 variant dataset
dataset:
  window_size: 199
  window_shift: 199
  val_window_size: 199
  val_window_shift: 199
