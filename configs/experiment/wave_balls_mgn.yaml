# @package _global_

defaults:
  - /trainer: default
  - /optimizer: adam
  - /scheduler: step
  - /logger: wandb
  - /plot: wandb
  - /model: mgn
  - /callbacks: default
  - /cluster: local
  - /env: wave_balls
  - /dataset: wave_balls
  - override /hydra/job_logging: colorlog
  - override /hydra/hydra_logging: colorlog
  - _self_

# Global configurations
experiment_name: WaveBalls
seed: 42
lr: 5e-4
epochs: 500
batch_size: 16
num_workers: 16
scheduler: null
debug: False
training_noise: True
training_noise_std: 1e-2
val_per_steps: 10
rollout_train: False
rollout_val: True

trainer:
  check_val_every_n_epoch: 10

model:
  num_messages: 15

plot:
  animation:
    fps: 10
    n_images: 3
    skip_frames: 5

logger:
  group: WaveBalls
  job_type: mgn
  name: wf_mgn_seed=${seed}

dataset:
  window_size: 2
  window_shift: 1
