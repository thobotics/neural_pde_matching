# @package _global_

defaults:
  - /trainer: default
  - /optimizer: adam
  - /scheduler: step
  - /logger: wandb
  - /plot: wandb
  - /model: mgn
  - /callbacks: default
  - /cluster: local
  - /env: abaqus_plate_deformation
  - /dataset: abaqus_plate_deformation
  - override /hydra/job_logging: colorlog
  - override /hydra/hydra_logging: colorlog
  - _self_

# Global configurations
experiment_name: AbaqusPlateDeformation
single_step: True
seed: 42
lr: 5e-4
epochs: 2000
batch_size: 8
num_workers: 4
scheduler: null
debug: False
training_noise: True
training_noise_std: 1e-2
val_per_steps: 10
rollout_train: False
rollout_val: True

trainer:
  check_val_every_n_epoch: 50

model:
  num_messages: 50

# MGN needs different settings
env:
  single_step: ${single_step}

plot:
  animation:
    fps: 10
    skip_frames: 3
    n_images: 6

logger:
  group: AbaqusPlateDeformation
  job_type: mgn_m=${model.num_messages}
  name: apd_mgn_seed=${seed}

dataset:
  window_size: 2
  window_shift: 1
  val_window_size: 2
  val_window_shift: 1
