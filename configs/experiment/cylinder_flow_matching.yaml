# @package _global_

defaults:
  - /trainer: default
  - /optimizer: adam
  - /scheduler: step
  - /logger: wandb  # wandb or mlflow
  - /plot: wandb
  - /model: pde_matching_igns
  - /callbacks: default
  - /cluster: local
  - override /hydra/job_logging: colorlog
  - override /hydra/hydra_logging: colorlog
  - _self_

# Global configurations
experiment_name: CylinderFlow
seed: 42
lr: 5e-4
epochs: 5000
batch_size: 4
num_workers: 4
scheduler: null
debug: False
training_noise: True
training_noise_std: 1e-2
val_per_steps: 10
rollout_train: False
rollout_val: False

trainer:
  check_val_every_n_epoch: 20

model:
  name: PDEMatching
  warmup_steps: 0
  stop_gradient_at_step: 0
  use_relative_timestep: False
  num_substeps: 1
  dynamic_config:
    num_enc_layers: 2
    damping_factor: 1.0
    external_force_factor: 0.5

env:
  name: "CylinderFlowEnv"
  input_keys: ["PROPERTIES", "STATE", "STATE_DOT"]
  output_keys: ["STATE", "STATE_DOT"]
  ignore_n_initial_steps: 0
  training_noise: ${training_noise}
  training_noise_std: ${training_noise_std}
  visualizer:
    n_columns: 3
    overlayed_ground_truth: False

plot:
  animation:
    fps: 10
    n_images: 6
    skip_frames: 5

  plot_at_every_n_val_step: 5

logger:
  group: CylinderFlow_30
  job_type: ${model.dynamic_name}
  name: cf_${model.dynamic_name}_seed=${seed}

dataset:
  root: /home/taihoang/datasets_new/cylinder_flow_origin
  window_size: 31
  window_shift: 30
  val_window_size: 31
  val_window_shift: 30
  train_n_sequences: 200
  val_n_sequences: null
  shuffle: True
  pin_memory: True
