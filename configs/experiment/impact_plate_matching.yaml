# @package _global_

defaults:
  - /trainer: default
  - /optimizer: adam
  - /scheduler: step
  - /logger: wandb
  - /plot: wandb
  - /model: pde_matching_igns
  - /callbacks: default
  - /cluster: local
  - /env: impact_plate
  - /dataset: impact_plate
  - override /hydra/job_logging: colorlog
  - override /hydra/hydra_logging: colorlog
  - _self_

# Global configurations
experiment_name: ImpactPlate
seed: 42
lr: 5e-4
epochs: 2000
batch_size: 4
num_workers: 4
scheduler: null
debug: False
training_noise: False
training_noise_std: 1e-2
val_per_steps: 10
rollout_train: False
rollout_val: False

trainer:
  check_val_every_n_epoch: 20
  gradient_clip_val: 0.5

model:
  warmup_steps: 15

logger:
  group: ImpactPlate
  job_type: ${model.dynamic_name}
  name: ip_${model.dynamic_name}_seed=${seed}
