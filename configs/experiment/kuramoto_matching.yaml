# @package _global_

defaults:
  - /trainer: default
  - /optimizer: adam
  - /scheduler: step
  - /logger: wandb
  - /plot: wandb
  - /model: pde_matching_igns
  - /callbacks: default
  - /cluster: local
  - /env: kuramoto
  - /dataset: kuramoto
  - override /hydra/job_logging: colorlog
  - override /hydra/hydra_logging: colorlog
  - _self_

# Global configurations
experiment_name: Kuramoto
seed: 42
lr: 5e-4
epochs: 3000
batch_size: 4
num_workers: 4
scheduler: null
debug: False
training_noise: True
training_noise_std: 1e-2
val_per_steps: 10
rollout_train: False
rollout_val: False

trainer:
  check_val_every_n_epoch: 20
  gradient_clip_val: 0.5

model:
  warmup_steps: 10
  stop_gradient_at_step: 0
  use_relative_timestep: True
  num_substeps: 1
  dynamic_config:
    num_enc_layers: 2
    damping_factor: 1.0

plot:
  animation:
    fps: 5
    skip_frames: 5
    n_images: 5
  plot_at_every_n_val_step: 5

logger:
  group: Kuramoto
  job_type: ${model.dynamic_name}
  name: ks_${model.dynamic_name}_seed=${seed}
