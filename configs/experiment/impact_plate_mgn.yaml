# @package _global_

defaults:
  - /trainer: default
  - /optimizer: adam
  - /scheduler: step
  - /logger: wandb
  - /plot: wandb
  - /model: mgn
  - /callbacks: default
  - /cluster: local
  - /env: impact_plate
  - /dataset: impact_plate
  - override /hydra/job_logging: colorlog
  - override /hydra/hydra_logging: colorlog
  - _self_

# Global configurations
experiment_name: ImpactPlate
seed: 42
lr: 5e-4
epochs: 500
batch_size: 4
num_workers: 16
scheduler: null
debug: False
training_noise: True
training_noise_std: 1e-2
val_per_steps: 10
rollout_train: False
rollout_val: True

trainer:
  check_val_every_n_epoch: 3

model:
  num_messages: 15

# MGN uses different env name and input keys
env:
  name: "ImpactPlateEnv"
  input_keys: ["PROPERTIES", "STATE_DOT"]
  visualizer:
    xy_min: [0.0, 0.0]
    xy_max: [10.0, 20.0]

logger:
  group: ImpactPlate
  job_type: mgn_m=${model.num_messages}
  name: ip_mgn_seed=${seed}

# MGN uses different window size
dataset:
  window_size: 2
  window_shift: 1
