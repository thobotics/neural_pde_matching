# @package _global_
# Impact Plate MGN experiment

defaults:
  - /trainer: default
  - /optimizer: adam
  - /scheduler: step
  - /logger: wandb  # wandb or mlflow
  - /plot: wandb
  - /model: mgn
  - /callbacks: default
  - /cluster: local
  - override /hydra/job_logging: colorlog
  - override /hydra/hydra_logging: colorlog
  - _self_

# Global configurations
experiment_name: ImpactPlate
seed: 42
lr: 5e-4
epochs: 500  # default is 50
# batch_size: 8
batch_size: 4
num_workers: 16
scheduler: null
debug: False
training_noise: True
training_noise_std: 1e-2
val_per_steps: 10
rollout_train: False
rollout_val: True

trainer:
  check_val_every_n_epoch: 3

model:
  num_messages: 15

env:
  name: "ImpactPlateEnv"
  input_keys: ["PROPERTIES", "STATE_DOT"]
  output_keys: ["STATE", "STATE_DOT"]
  ignore_n_initial_steps: 0
  training_noise: ${training_noise}
  training_noise_std: ${training_noise_std}
  visualizer:
    plot_stress: True
    n_columns: 3
    overlayed_ground_truth: False
    stress_only: False
    xy_min: [0.0, 0.0]
    xy_max: [10.0, 20.0]

logger:
  group: ImpactPlate
  job_type: mgn_m=${model.num_messages}
  name: ip_mgn_seed=${seed}

dataset:
  root: /home/taihoang/datasets_new/impact_plate_norm_all_2
  # root: /home/taihoang/datasets_new/impact_plate
  ignore_n_initial_steps: 0
  window_size: 2
  window_shift: 1
  val_window_size: 51
  val_window_shift: 51
  train_n_sequences: null
  val_n_sequences: null
  shuffle: True
  pin_memory: True
