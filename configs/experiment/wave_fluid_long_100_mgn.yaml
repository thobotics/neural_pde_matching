# @package _global_
# Abaqus Plate Deformation MGN experiment

defaults:
  - /trainer: default
  - /optimizer: adam
  - /scheduler: step
  - /logger: wandb  # wandb or mlflow
  - /plot: wandb
  - /model: mgn
  - /callbacks: default
  - /cluster: local
  - override /hydra/job_logging: colorlog
  - override /hydra/hydra_logging: colorlog
  - _self_

# Global configurations
experiment_name: WaveFluid_Long
seed: 42
lr: 5e-4
epochs: 500
batch_size: 16
num_workers: 16
scheduler: null
debug: False
training_noise: True
training_noise_std: 1e-2
val_per_steps: 10
rollout_train: False
rollout_val: True

trainer:
  check_val_every_n_epoch: 1

model:
  num_messages: 15

env:
  name: "WaveLongEnv"
  input_keys: ["PROPERTIES", "STATE"]
  output_keys: ["STATE", "STATE_DOT"]
  ignore_n_initial_steps: 0
  training_noise: ${training_noise}
  training_noise_std: ${training_noise_std}
  visualizer:
    n_columns: 3
    overlayed_ground_truth: False
    support_negative_density: True
    plot_as_images: True
    cmap: RdBu

plot:
  animation:
    fps: 10
    n_images: 3
    skip_frames: 5

  plot_at_every_n_val_step: 5

logger:
  # group: WaveFluid_200
  group: WaveFluid_100_update
  job_type: mgn
  name: wf_mgn_seed=${seed}

dataset:
  root: /home/taihoang/datasets_new/wave_long_skip
  window_size: 2
  window_shift: 1
  val_window_size: 99
  val_window_shift: 99
  train_n_sequences: null
  val_n_sequences: null
  shuffle: True
  pin_memory: True
