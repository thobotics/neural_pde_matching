# @package _global_

defaults:
  - /trainer: default
  - /optimizer: adam
  - /scheduler: step
  - /logger: wandb
  - /plot: wandb
  - /model: mgn
  - /callbacks: default
  - /cluster: local
  - /env: sphere_cloth
  - /dataset: sphere_cloth_long
  - override /hydra/job_logging: colorlog
  - override /hydra/hydra_logging: colorlog
  - _self_

# Global configurations
experiment_name: SphereCloth
seed: 42
lr: 5e-4
epochs: 500
batch_size: 16
num_workers: 16
scheduler: null
debug: False
training_noise: True
training_noise_std: 1e-2
val_per_steps: 10
rollout_train: False
rollout_val: True

trainer:
  check_val_every_n_epoch: 5

model:
  num_messages: 15

# Long variant with MGN-specific input keys
env:
  name: "SphereClothCouplingLongEnv"
  input_keys: ["PROPERTIES", "STATE_DOT"]

plot:
  animation:
    fps: 10
    skip_frames: 2
    n_images: 5

logger:
  group: SphereCloth
  job_type: mgn_m=${model.num_messages}
  name: scc_mgn_seed=${seed}

dataset:
  window_size: 2
  window_shift: 1
